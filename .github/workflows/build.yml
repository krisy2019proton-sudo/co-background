name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install system dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip openjdk-11-jdk autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses5:i386 libstdc++6:i386 zlib1g:i386 cmake libffi-dev libssl-dev libltdl-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install "cython<3.0" buildozer
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
